name: onchain

# Builds and tests the Solana program on a Linux runner, so the toolchain
# never has to exist on anyone's laptop.
#
# Runs inside the official Anchor image: compiling anchor-cli on a bare
# runner is slow and fragile.

on:
  push:
    paths: ["onchain/**", ".github/workflows/onchain.yml"]
  pull_request:
    paths: ["onchain/**", ".github/workflows/onchain.yml"]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: solanafoundation/anchor:v1.0.2
      options: --user root
    defaults:
      run:
        working-directory: onchain

    steps:
      - uses: actions/checkout@v4

      - name: Locate the image's toolchain
        continue-on-error: true
        run: |
          echo "whoami=$(whoami)  HOME=$HOME"
          command -v rustup rustc cargo solana anchor node yarn || true
          rustup toolchain list || true

      - name: Select a default Rust toolchain
        run: |
          rustup default stable || true
          rustc --version
          cargo --version

      - name: Versions
        run: |
          solana --version
          anchor --version
          node --version || echo "no node"
          yarn --version || echo "no yarn"

      - name: Wallet for the provider
        run: |
          mkdir -p ~/.config/solana
          solana-keygen new --no-bip39-passphrase --force -o ~/.config/solana/id.json
          solana config set --url localhost

      - name: Cache cargo and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            onchain/target
          key: anchor-1.0.2-${{ hashFiles('onchain/**/Cargo.toml') }}
          restore-keys: anchor-1.0.2-

      # Log downloads need a token even on a public repo, but annotations do
      # not. Failing steps echo their tail as ::error:: so the reason is
      # readable without one. [:space:] avoids escaping a newline in YAML,
      # which is what broke this file once already.
      - name: Sync the program id with the generated keypair
        run: |
          set -o pipefail
          build_all() {
            anchor build --ignore-keys &&
            anchor keys sync &&
            anchor keys list &&
            anchor build
          }
          build_all 2>&1 | tee /tmp/step.log || {
            echo "::error::build: $(tail -c 1800 /tmp/step.log | tr '[:space:]' ' ')"
            exit 1
          }

      - name: Install JS dependencies
        run: |
          set -o pipefail
          yarn install 2>&1 | tee /tmp/step.log || {
            echo "::error::yarn: $(tail -c 1200 /tmp/step.log | tr '[:space:]' ' ')"
            exit 1
          }

      - name: Test against a local validator
        run: |
          set -o pipefail
          anchor test --skip-build 2>&1 | tee /tmp/step.log || {
            echo "::error::test: $(tail -c 1800 /tmp/step.log | tr '[:space:]' ' ')"
            exit 1
          }

      - name: Upload the built program
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backsy-program
          path: |
            onchain/target/deploy/backsy.so
            onchain/target/idl/backsy.json
            onchain/target/types/backsy.ts
          if-no-files-found: warn
