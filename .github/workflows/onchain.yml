name: onchain

# Builds and tests the Solana program on a Linux runner, so the toolchain
# never has to exist on anyone's laptop.
#
# It runs inside the official Anchor image rather than installing Rust,
# Solana and Anchor from scratch: compiling anchor-cli on a bare runner is
# slow and is what broke the first two attempts.

on:
  push:
    paths: ["onchain/**", ".github/workflows/onchain.yml"]
  pull_request:
    paths: ["onchain/**", ".github/workflows/onchain.yml"]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: solanafoundation/anchor:v0.31.1
      options: --user root
    defaults:
      run:
        working-directory: onchain

    steps:
      - uses: actions/checkout@v4

      # Never fails: one run of this tells us where the image keeps things.
      - name: Locate the image's toolchain
        continue-on-error: true
        run: |
          echo "whoami=$(whoami)  HOME=$HOME"
          echo "RUSTUP_HOME=${RUSTUP_HOME:-unset}  CARGO_HOME=${CARGO_HOME:-unset}"
          for d in /usr/local/rustup /usr/local/cargo /root/.rustup /root/.cargo; do
            [ -d "$d" ] && echo "exists: $d"
          done
          command -v rustup rustc cargo solana anchor node yarn || true
          rustup toolchain list || true

      # The image ships rustup but root has no default toolchain selected,
      # which is exactly what broke the previous run.
      - name: Select a default Rust toolchain
        run: |
          rustup default stable
          rustc --version

      - name: Versions
        run: |
          solana --version
          anchor --version
          node --version || echo "no node"
          yarn --version || echo "no yarn"

      - name: Wallet for the provider
        run: |
          mkdir -p ~/.config/solana
          solana-keygen new --no-bip39-passphrase --force -o ~/.config/solana/id.json
          solana config set --url localhost

      - name: Cache cargo and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            onchain/target
          key: anchor-0.31.1-${{ hashFiles('onchain/**/Cargo.toml') }}
          restore-keys: anchor-0.31.1-

      # Solana's platform-tools ships Cargo 1.79, which cannot parse a manifest
      # declaring edition2024. Resolve the lockfile with the host cargo, which
      # can, then hold the offenders at their last compatible release.
      - name: Pin crates newer than the on-chain toolchain's Cargo
        run: |
          cargo generate-lockfile
          cargo update -p cpufeatures --precise 0.2.17
          grep -A1 'name = "cpufeatures"' Cargo.lock | head -4

      - name: Sync the program id with the generated keypair
        run: |
          anchor build
          anchor keys sync
          anchor build

      - name: Install JS dependencies
        run: yarn install

      - name: Test against a local validator
        run: anchor test --skip-build

      - name: Upload the built program
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backsy-program
          path: |
            onchain/target/deploy/backsy.so
            onchain/target/idl/backsy.json
            onchain/target/types/backsy.ts
          if-no-files-found: warn
