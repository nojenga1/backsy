name: devnet

# Deploys the program to devnet from an already-funded wallet. Manual only.
#
# Funding happens on a developer machine, not here: the proof-of-work faucet
# is the only route left, and running proof-of-work on GitHub's runners reads
# as crypto mining, which their acceptable use policy forbids. This workflow
# only checks the wallet has enough and then deploys.

on:
  workflow_dispatch:
    inputs:
      min_sol:
        description: "Refuse to deploy unless the wallet holds at least this"
        default: "2"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: solanafoundation/anchor:v1.0.2
      options: --user root
    defaults:
      run:
        working-directory: onchain
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Select a default Rust toolchain
        run: |
          rustup default stable || true
          rustc --version

      - name: Load the devnet wallet
        env:
          DEVNET_KEYPAIR: ${{ secrets.DEVNET_KEYPAIR }}
        run: |
          if [ -z "$DEVNET_KEYPAIR" ]; then
            echo "::error::secret DEVNET_KEYPAIR is not set"
            exit 1
          fi
          mkdir -p ~/.config/solana
          printf '%s' "$DEVNET_KEYPAIR" > ~/.config/solana/id.json
          solana config set --url devnet
          echo "wallet: $(solana address)"
          echo "balance: $(solana balance)"

      - name: Check the wallet is funded
        run: |
          BAL=$(solana balance | awk '{print $1}')
          MIN="${{ github.event.inputs.min_sol }}"
          echo "balance ${BAL} SOL, need ${MIN}"
          awk "BEGIN{exit !(${BAL} >= ${MIN})}" || {
            echo "::error::wallet holds ${BAL} SOL, needs ${MIN}. Fund it with devnet-pow locally."
            exit 1
          }

      - name: Build
        run: |
          set -o pipefail
          { anchor build --ignore-keys && anchor keys sync && anchor build; } 2>&1 \
            | tee /tmp/step.log || {
              echo "::error::build: $(tail -c 1500 /tmp/step.log | tr '[:space:]' ' ')"
              exit 1
            }

      # A failed deploy strands the upload buffer and the rent inside it.
      - name: Recover stranded deploy buffers
        run: |
          solana program close --buffers --bypass-warning || true
          echo "balance after cleanup: $(solana balance)"

      # `anchor deploy` is deprecated and gives no control over retries. The
      # public devnet RPC drops some of the hundreds of write transactions a
      # deploy sends, which is what "max retries exceeded" meant; --use-rpc
      # plus a high signing-attempt count rides that out.
      - name: Deploy to devnet
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "=== deploy attempt $attempt ==="
            if solana program deploy                  --url devnet                  --use-rpc                  --max-sign-attempts 200                  --program-id target/deploy/backsy-keypair.json                  target/deploy/backsy.so 2>&1 | tee /tmp/step.log; then
              echo "deployed"
              break
            fi
            solana program close --buffers --bypass-warning || true
            if [ "$attempt" = "3" ]; then
              echo "::error::deploy: $(tail -c 1500 /tmp/step.log | tr '[:space:]' ' ')"
              exit 1
            fi
            sleep 15
          done
          {
            echo "### deployed to devnet"
            echo '```'
            echo "program id: $(solana address -k target/deploy/backsy-keypair.json)"
            echo "remaining balance: $(solana balance)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the program keypair
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: program-keypair
          path: onchain/target/deploy/backsy-keypair.json
          if-no-files-found: warn
